<!-- ============================================================
     NXT APEX AI: "Stop The Leaks" Funnel, Page 2b (Thanks / Rejection)
     Paste this on its own GHL page at fb.nxtapexai.com/thanks
     (or wherever THANKS_URL in stop-the-leaks.html points).
     Every disqualified path from page 1 redirects here.

     Reads ?reason= from the URL (page 1 sets this: wrong_fit,
     low_volume, or declined_commitment) and shows matching copy.
     Falls back to a generic message if the param is missing or
     unrecognized.
   ============================================================ -->

<div class="nxt-stl">

  <header class="nxt-stl__header">
    <a href="https://nxtapexai.com" class="nxt-stl__brand">
      <img src="https://nxtapexai.com/logo-trans-light.png" alt="Nxt Apex AI" />
      <span>Nxt Apex AI</span>
    </a>
    <a href="tel:+15042904780" class="nxt-stl__phone">(504) 290-4780</a>
  </header>

  <section class="nxt-stl__hero">
    <div class="nxt-stl__hero-bg" aria-hidden="true"></div>
    <div class="nxt-stl__wrap nxt-stl__hero-inner" data-reveal>
      <span class="nxt-stl__eyebrow"><i class="nxt-stl__dot"></i>Thanks For Your Time</span>
      <h1 class="nxt-stl__h1">This Isn&rsquo;t a Fit Right Now.</h1>
      <p class="nxt-stl__hero-sub" id="nxtThanksBody">
        Based on your answers, the timing isn&rsquo;t right for a call like this right now.
      </p>
      <a href="https://nxtapexai.com" class="nxt-stl__btn nxt-stl__btn--gold">Back to Nxt Apex AI</a>

        <a href="mailto:sean@nxtapexai.com">sean@nxtapexai.com</a>
        <a href="https://nxtapexai.com/privacy-policy">Privacy Policy</a>
      </div>
    </div>
  </footer>

</div>

<style>
  .nxt-stl{--gold:#C6A62C;--gold-light:#e8c84a;--ink:#0D0D0F;--panel:#14141a;--panel-2:#0a0a0c;--line:rgba(255,255,255,0.08);--muted:rgba(255,255,255,0.45);--muted-2:rgba(255,255,255,0.25);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Arial,sans-serif;color:#fff;background:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased;}
  .nxt-stl *{box-sizing:border-box;}
  .nxt-stl img{max-width:100%;display:block;}
  .nxt-stl__wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

  .nxt-stl__header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;max-width:1120px;margin:0 auto;}
  .nxt-stl__brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;font-size:15px;}
  .nxt-stl__brand img{height:26px;width:auto;}
  .nxt-stl__phone{color:var(--gold);font-weight:600;font-size:13px;text-decoration:none;}

  .nxt-stl__hero{position:relative;overflow:hidden;padding:100px 0;min-height:60vh;display:flex;align-items:center;}
  .nxt-stl__hero-bg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 700px 420px at 50% 0%, rgba(198,166,44,0.1) 0%, transparent 65%);}
  .nxt-stl__hero-inner{position:relative;text-align:center;max-width:600px;margin:0 auto;}
  .nxt-stl__eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.5);margin-bottom:28px;}
  .nxt-stl__dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px rgba(198,166,44,0.9);}
  .nxt-stl__h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;line-height:1.15;letter-spacing:-0.01em;margin:0 0 20px;}
  .nxt-stl__hero-sub{font-size:clamp(16px,1.8vw,18px);font-weight:500;line-height:1.6;color:rgba(255,255,255,0.6);margin:0 auto 36px;}

  .nxt-stl__btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;border:none;cursor:pointer;transition:transform .18s ease, box-shadow .18s ease;}
  .nxt-stl__btn--gold{background:var(--gold);color:#000;box-shadow:0 8px 30px rgba(198,166,44,0.3);}
  .nxt-stl__btn--gold:hover{transform:translateY(-2px);box-shadow:0 10px 36px rgba(198,166,44,0.4);}

  .nxt-stl__footer{padding:32px 0;border-top:1px solid var(--line);background:var(--panel-2);}
  .nxt-stl__footer-inner{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;font-size:12px;color:var(--muted-2);}
  @media(min-width:560px){.nxt-stl__footer-inner{flex-direction:row;justify-content:space-between;text-align:left;}}
  .nxt-stl__footer-links{display:flex;gap:18px;}
  .nxt-stl__footer-links a{color:var(--muted-2);text-decoration:none;}
  .nxt-stl__footer-links a:hover{color:rgba(255,255,255,0.6);}

  .nxt-stl [data-reveal]{opacity:0;transform:translateY(22px);transition:opacity .6s ease, transform .6s ease;}
  .nxt-stl [data-reveal].is-visible{opacity:1;transform:translateY(0);}
  @media(prefers-reduced-motion:reduce){ .nxt-stl [data-reveal]{opacity:1;transform:none;transition:none;} }
</style>

<script>
(function(){
  var scope = document.querySelector('.nxt-stl') || document;

  var revealEls = scope.querySelectorAll('[data-reveal]');
  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) { entry.target.classList.add('is-visible'); io.unobserve(entry.target); }
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -60px 0px' });
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('is-visible'); });
  }

  // Unicode escapes, not literal curly-quote characters, so this
  // renders correctly even if the host GHL page doesn't declare
  // UTF-8 in its own <head>.
  var RQ = '\u2019';
  var REJECTION_COPY = {
    wrong_fit: 'Sounds like you need a lead gen partner. That' + RQ + 's not us. We don' + RQ + 't run ads or generate new leads, we fix what happens after someone already raised their hand, the leads you already paid for. If more leads is the actual gap, a marketing or ads agency is the better fit for that piece.',
    low_volume: 'Right now we' + RQ + 're built for businesses with more lead flow than that. Closing gaps only moves the needle once there' + RQ + 's real volume to work with. Come back when that number changes.',
    declined_commitment: 'Based on your answers, the timing isn' + RQ + 't right for a call like this right now. No hard feelings. Reach out when it is.'
  };

  var params = new URLSearchParams(window.location.search);
  var reason = params.get('reason');
  var bodyEl = document.getElementById('nxtThanksBody');
  bodyEl.textContent = REJECTION_COPY[reason] || REJECTION_COPY.declined_commitment;
})();
</script>
